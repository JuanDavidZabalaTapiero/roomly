name: Server tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: roomly_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d roomly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/roomly_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/roomly_test
      SECRET_KEY: ci-only-test-key-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -v tests/
